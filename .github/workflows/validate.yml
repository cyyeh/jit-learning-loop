name: validate

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check SKILL.md against the Agent Skills spec
        run: node scripts/validate.mjs
      - name: Test the skill's helper scripts
        run: node --test scripts/*.test.mjs
      - name: Check the skill is discoverable by `npx skills`
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills@latest add . --list 2>&1 | tee list.txt
          grep -q "jit-learning-loop" list.txt
