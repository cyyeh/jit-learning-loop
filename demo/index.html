<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jit-learning-loop · Demo</title>
<meta name="description" content="Recorded jit-learning-loop sessions: an engineer builds login for an API without ever having built auth, and another fixes a double-charge bug with a Redis lock. The agent finishes the task while the learner builds a reusable mental model. 真實錄製的 jit-learning-loop session：第一次做 auth 就要替 API 加上登入，以及用 Redis lock 修 double charge。Agent 把 task 做完，學習者也留下可遷移的 mental model。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:wght@600;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f3ec;
    --surface: #fffdf8;
    --surface-2: #efebe1;
    --ink: #1f1c16;
    --ink-2: #4a453b;
    --muted: #7a7466;
    --line: #e2ddd0;
    --accent: #0f6b5f;
    --accent-soft: #dcefe9;
    --learner: #9a5b13;
    --learner-soft: #f7ead6;
    --check: #b4411b;
    --check-soft: #fbe3d8;
    --code-bg: #f1ede3;
    --term-bg: #1c1a15;
    --term-ink: #e8e3d6;
    --add: #1f7a3a;
    --add-bg: #e3f4e6;
    --del: #a3302a;
    --del-bg: #fbe5e3;
    --shadow: 0 2px 8px rgba(31, 28, 22, .10);
    --radius: 14px;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --serif: "Noto Serif TC", "Songti TC", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  /* Latin fonts first in English, so quotes and punctuation use proportional glyphs */
  html[lang="en"] {
    --sans: "Noto Sans", "Noto Sans TC", system-ui, sans-serif;
    --serif: "Noto Serif", "Noto Serif TC", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13120f;
      --surface: #1b1a16;
      --surface-2: #24221d;
      --ink: #ece8de;
      --ink-2: #c9c3b5;
      --muted: #9a9384;
      --line: #2f2c25;
      --accent: #5cc4b0;
      --accent-soft: #173a34;
      --learner: #e0a55c;
      --learner-soft: #3a2a15;
      --check: #f08a63;
      --check-soft: #3d1f14;
      --code-bg: #24221d;
      --term-bg: #0d0c0a;
      --term-ink: #e8e3d6;
      --add: #7fd99a;
      --add-bg: #15301d;
      --del: #f19a92;
      --del-bg: #3a1a17;
      --shadow: 0 2px 8px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  a { color: var(--accent); text-underline-offset: 3px; }
  code, pre, kbd { font-family: var(--mono); }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

  /* ---------- top bar + language toggle ---------- */
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 28px; }
  .eyebrow {
    display: inline-flex; gap: 8px; align-items: center;
    font: 600 13px/1 var(--mono); letter-spacing: .04em; color: var(--accent);
    background: var(--accent-soft); padding: 7px 12px; border-radius: 999px;
  }
  .lang { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .lang button {
    font: 600 13px/1 var(--sans); border: 0; background: none; color: var(--muted);
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  /* ---------- scenario picker ---------- */
  .picker { padding-top: 28px; }
  .pick-label { font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pick-grid button {
    display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .pick-grid button:hover { border-color: var(--accent); }
  .pick-grid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pick-grid button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pick-grid .kind { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--mono); letter-spacing: .04em; color: var(--accent); }
  .pick-grid .new { padding: 4px 6px; border-radius: 6px; background: var(--check-soft); color: var(--check); }
  .pick-grid .viewing { margin-left: auto; color: var(--muted); font-weight: 400; }
  .pick-grid button[aria-pressed="false"] .viewing { visibility: hidden; }
  .pick-grid b { font-size: 17px; line-height: 1.4; }
  .pick-grid .desc { color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }

  /* ---------- hero ---------- */
  header.hero { padding-top: 36px; padding-bottom: 40px; }
  h1 {
    font-family: var(--serif); font-weight: 900; font-size: clamp(34px, 6vw, 60px); line-height: 1.15;
    letter-spacing: -.01em; margin: 0 0 18px; max-width: 16em;
  }
  .lead { font-size: clamp(17px, 2.2vw, 19px); color: var(--ink-2); margin: 0; max-width: 40em; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 36px 0 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .stat b { display: block; font-family: var(--serif); font-weight: 900; font-size: 30px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 14px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .install {
    display: flex; align-items: center; gap: 10px; max-width: 100%;
    background: var(--term-bg); color: var(--term-ink);
    border-radius: 10px; padding: 10px 10px 10px 16px; font: 14px/1.4 var(--mono);
  }
  .install code { overflow-x: auto; white-space: nowrap; }
  .install .prompt { color: #8f8a7c; user-select: none; }
  button.copy {
    font: 600 12px/1 var(--sans); border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer;
    background: #34312a; color: var(--term-ink); flex-shrink: 0;
  }
  button.copy:hover { background: #45413a; }
  .ghost { font-weight: 500; text-decoration: none; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
  .ghost:hover { border-color: var(--accent); }

  /* ---------- sections ---------- */
  section { padding-top: 44px; padding-bottom: 44px; border-top: 1px solid var(--line); }
  h2 { font-family: var(--serif); font-weight: 900; font-size: clamp(26px, 3.6vw, 34px); line-height: 1.25; margin: 0 0 10px; }
  .section-lead { color: var(--ink-2); margin: 0 0 28px; max-width: 44em; }
  blockquote.core {
    margin: 0; padding: 22px 26px; border-left: 4px solid var(--accent);
    background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
    font-family: var(--serif); font-weight: 600; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.6;
  }
  blockquote.core small { display: block; margin-top: 8px; font-family: var(--sans); font-weight: 400; font-size: 14px; line-height: 1.5; color: var(--muted); }

  .loop { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin: 28px 0 0; padding: 0; }
  .loop li {
    list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 12px 14px; font-size: 14px; line-height: 1.45;
  }
  .loop li b { display: block; font-size: 15px; margin-bottom: 4px; }
  .loop li .n { font: 600 12px/1 var(--mono); color: var(--muted); }
  .loop li.checkpoint { border-color: var(--check); background: var(--check-soft); }
  .loop li.checkpoint .n { color: var(--check); }

  /* ---------- session layout ---------- */
  .session { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
  nav.rail { position: sticky; top: 24px; }
  nav.rail h3 { font: 600 12px/1 var(--mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 0 0 12px; }
  nav.rail ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  nav.rail li { padding: 6px 0 6px 14px; margin-left: -2px; border-left: 2px solid transparent; font-size: 14px; color: var(--muted); transition: color .2s, border-color .2s; }
  nav.rail li.on { color: var(--ink); border-left-color: var(--accent); font-weight: 500; }
  nav.rail li.checkpoint.on { border-left-color: var(--check); }
  nav.rail .turnlinks { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav.rail .turnlinks a { font: 600 12px/1 var(--mono); padding: 7px 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink-2); }
  nav.rail .turnlinks a.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }

  .translated {
    margin: 0 0 22px; padding: 12px 16px; border-radius: 12px;
    background: var(--accent-soft); color: var(--ink-2); font-size: 14.5px; line-height: 1.6;
  }

  .turn { margin-bottom: 34px; scroll-margin-top: 20px; }
  .turn-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
  .who { font: 600 13px/1 var(--mono); padding: 7px 10px; border-radius: 8px; }
  .turn.user .who { background: var(--learner-soft); color: var(--learner); }
  .turn.agent .who { background: var(--accent-soft); color: var(--accent); }
  .chip { font-size: 12.5px; line-height: 1; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); }
  .chip.checkpoint { border-color: var(--check); color: var(--check); background: var(--check-soft); }
  .raw { margin-left: auto; font: 12px/1.4 var(--mono); color: var(--muted); }
  .raw a { color: var(--muted); }

  .note {
    display: flex; gap: 10px; margin: 0 0 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--surface-2); color: var(--ink-2); font-size: 14.5px; line-height: 1.65;
  }
  .note::before { content: attr(data-label); flex-shrink: 0; font: 600 11px/1.9 var(--mono); color: var(--muted); letter-spacing: .08em; }

  .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 24px; position: relative; }
  .turn.user .bubble { background: var(--learner-soft); border-color: transparent; }
  .bubble.folded { max-height: 560px; overflow: hidden; }
  .bubble.folded::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 140px; border-radius: 0 0 var(--radius) var(--radius);
    background: linear-gradient(to bottom, transparent, var(--surface) 85%);
  }
  .unfold {
    display: block; margin: -22px auto 0; position: relative; z-index: 1;
    font: 600 14px/1 var(--sans); padding: 11px 18px; border-radius: 999px; cursor: pointer;
    border: 0; background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
  }
  .unfold:hover { background: var(--accent); }

  /* rendered markdown */
  .md h1 { font-family: var(--sans); font-weight: 700; font-size: 22px; line-height: 1.4; margin: 22px 0 10px; }
  .md h2 { font-family: var(--sans); font-weight: 700; font-size: 20px; line-height: 1.4; margin: 26px 0 10px; }
  .md h3 { font-family: var(--sans); font-weight: 700; font-size: 17px; line-height: 1.4; margin: 22px 0 8px; }
  .md p, .md ul, .md ol, .md table, .md pre, .md blockquote { margin: 12px 0; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li { margin: 4px 0; }
  .md code { font-size: .88em; background: var(--code-bg); padding: .12em .38em; border-radius: 5px; }
  .md pre { background: var(--code-bg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.55; }
  .md pre code { background: none; padding: 0; font-size: 13.5px; }
  .md pre code.hljs { background: none; padding: 0; }
  .md blockquote { margin-left: 0; padding: 4px 16px; border-left: 3px solid var(--line); color: var(--ink-2); }
  .md table { border-collapse: collapse; width: 100%; font-size: 14.5px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--surface-2); }

  /* evidence */
  .stack { display: grid; gap: 18px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .card-head b { font-size: 15px; }
  .card-head a { font: 12px/1 var(--mono); color: var(--muted); }
  .badge { font: 600 12px/1 var(--mono); padding: 5px 8px; border-radius: 6px; margin-left: 6px; }
  .badge.fail { background: var(--del-bg); color: var(--del); }
  .badge.pass { background: var(--add-bg); color: var(--add); }
  pre.term {
    margin: 0; padding: 16px 18px; background: var(--term-bg); color: var(--term-ink);
    font: 12.5px/1.6 var(--mono); overflow: auto; max-height: 420px; white-space: pre;
  }
  pre.term span { display: inline-block; min-width: 100%; }
  pre.term .hl { color: #ffd37a; }
  pre.term .bad { color: #ff8f84; }
  pre.term .good { color: #8fe0a6; }
  pre.diff { margin: 0; font: 12.5px/1.6 var(--mono); overflow: auto; max-height: 560px; padding: 10px 0; background: var(--surface); }
  pre.diff span { display: block; padding: 0 18px; white-space: pre; }
  pre.diff .a { background: var(--add-bg); color: var(--add); }
  pre.diff .d { background: var(--del-bg); color: var(--del); }
  pre.diff .h { color: var(--muted); }
  pre.diff .f { font-weight: 600; color: var(--ink); background: var(--surface-2); margin-top: 8px; }

  /* comparison: the table draws its own border so every cell's padding sits inside it */
  .cmp-scroll { overflow-x: auto; }
  table.cmp {
    width: 100%; border-collapse: separate; border-spacing: 0; font-size: 15px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  table.cmp th, table.cmp td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.cmp thead th { background: var(--surface-2); font-size: 14px; }
  table.cmp thead th:first-child { border-top-left-radius: var(--radius); }
  table.cmp thead th:last-child { border-top-right-radius: var(--radius); }
  table.cmp tbody tr:last-child td { border-bottom: 0; }
  table.cmp td.y { color: var(--add); font-weight: 600; white-space: nowrap; }
  table.cmp td.n { color: var(--del); font-weight: 600; white-space: nowrap; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .after-table { margin-top: 16px; }

  .method { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .method .card { padding: 18px 20px; }
  .method h3 { margin: 0 0 8px; font-size: 17px; }
  .method p, .method ul { margin: 0; color: var(--ink-2); font-size: 15px; }
  .method ul { padding-left: 1.2em; }

  footer { padding-top: 36px; padding-bottom: 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .error { padding: 14px 18px; border-radius: 12px; background: var(--check-soft); color: var(--check); }

  @media (max-width: 960px) {
    .session { grid-template-columns: minmax(0, 1fr); gap: 0; }
    nav.rail { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px; margin: 0 -16px 16px; border-bottom: 1px solid var(--line); }
    nav.rail h3, nav.rail ol { display: none; }
    nav.rail .turnlinks { margin: 0; flex-wrap: nowrap; overflow-x: auto; }
    .loop { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-2, .method { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    header.hero { padding-top: 28px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .loop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pick-grid { grid-template-columns: minmax(0, 1fr); }
    .kpis { grid-template-columns: minmax(0, 1fr); }
    .bubble { padding: 4px 16px; }
    .raw { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="topbar wrap">
  <span class="eyebrow">jit-learning-loop · DEMO</span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<nav class="picker wrap" aria-labelledby="pick-label">
  <p class="pick-label" id="pick-label" data-i18n="pick.label"></p>
  <div class="pick-grid" id="picker"></div>
</nav>

<header class="hero wrap">
  <h1 data-i18n="hero.title"></h1>
  <p class="lead" data-i18n="hero.lead"></p>

  <div class="stats" id="stats"></div>

  <div class="cta">
    <div class="install"><span class="prompt">$</span><code id="install-cmd">npx skills add cyyeh/jit-learning-loop</code><button class="copy" data-copy="install-cmd" data-i18n="copy"></button></div>
    <a class="ghost" href="https://github.com/cyyeh/jit-learning-loop">GitHub →</a>
  </div>
</header>

<section class="wrap" id="idea">
  <h2 data-i18n="idea.title"></h2>
  <blockquote class="core"><span data-i18n="idea.quote"></span>
    <small data-i18n="idea.small"></small>
  </blockquote>
  <ol class="loop" id="loop"></ol>
</section>

<section class="wrap" id="session">
  <h2 data-i18n="session.title"></h2>
  <p class="section-lead" data-i18n="session.lead"></p>
  <div class="session">
    <nav class="rail" aria-label="Loop">
      <h3 data-i18n="rail.title"></h3>
      <ol id="rail"></ol>
      <div class="turnlinks" id="turnlinks"></div>
    </nav>
    <div>
      <p class="translated" data-i18n="session.translated"></p>
      <div id="turns"></div>
    </div>
  </div>
</section>

<section class="wrap" id="evidence">
  <h2 data-i18n="evidence.title"></h2>
  <p class="section-lead" data-i18n="evidence.lead"></p>
  <div class="stack" id="evidence-cards"></div>
</section>

<section class="wrap" id="log">
  <h2 data-i18n="log.title"></h2>
  <p class="section-lead" data-i18n="log.lead"></p>
  <div class="bubble md" id="learning-log"></div>
</section>

<section class="wrap" id="compare">
  <h2 data-i18n="compare.title"></h2>
  <p class="section-lead" data-i18n="compare.lead"></p>
  <div class="kpis">
    <div class="stat"><b>100%</b><span data-i18n="compare.kpi.with"></span></div>
    <div class="stat"><b>57%</b><span data-i18n="compare.kpi.without"></span></div>
    <div class="stat"><b>4 / 4</b><span data-i18n="compare.kpi.correct"></span></div>
  </div>
  <div class="cmp-scroll">
    <table class="cmp">
      <thead><tr><th data-i18n="compare.th.behavior"></th><th data-i18n="compare.th.with"></th><th data-i18n="compare.th.without"></th></tr></thead>
      <tbody>
        <tr><td data-i18n="compare.row.gap"></td><td class="y">4 / 4</td><td class="n">0 / 4</td></tr>
        <tr><td data-i18n="compare.row.predict"></td><td class="y">4 / 4</td><td class="n">0 / 4</td></tr>
        <tr><td data-i18n="compare.row.holdback"></td><td class="y">4 / 4</td><td class="n">1 / 4</td></tr>
        <tr><td data-i18n="compare.row.fundamentals"></td><td class="y">3 / 3</td><td class="n">0 / 3</td></tr>
        <tr><td data-i18n="compare.row.correct"></td><td class="y">4 / 4</td><td class="y">4 / 4</td></tr>
      </tbody>
    </table>
  </div>
  <p class="section-lead after-table" data-i18n="compare.more"></p>
</section>

<section class="wrap" id="method">
  <h2 data-i18n="method.title"></h2>

const transcriptDir = (l = lang) => l === sc().original ? "transcript/" : `transcript/${l}/`;
const turnPath = (turn, l = lang) => `${sc().dir}${transcriptDir(l)}${turnName(turn)}`;
const logPath = (l = lang) => `${sc().dir}project/LEARNING_LOG${l === sc().original ? "" : `.${l}`}.md`;
const stepLabel = (id) => {
  const i = STEP_IDS.indexOf(id);
  return `${i} ${t("steps")[i][0]}${CHECKPOINTS.has(id) ? " ✋" : ""}`;
};

function pickLanguage() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "zh") return q;
  try {
    const saved = localStorage.getItem("jit-demo-lang");
    if (saved === "en" || saved === "zh") return saved;
  } catch (_) {}
  return /^zh\b/i.test(navigator.language || "") ? "zh" : "en";
}

// The scenario comes only from the URL, so a fresh visit always opens the default one.
function pickScenario() {
  const q = new URLSearchParams(location.search).get("demo");
  return q && Object.hasOwn(SCENARIOS, q) ? q : SCENARIO_IDS[0];
}

marked.setOptions({ gfm: true, breaks: false });

function renderMarkdown(src) {
  const { dir, codePaths } = sc();
  const el = document.createElement("div");
  el.className = "md";
  el.innerHTML = DOMPurify.sanitize(marked.parse(src));
  el.querySelectorAll("pre code").forEach((c) => { try { hljs.highlightElement(c); } catch (_) {} });
  // Link file references in inline code to the recorded files on GitHub.
  el.querySelectorAll(":not(pre) > code").forEach((c) => {
    const s = c.textContent.trim();
    let href = null;
    if (/^artifacts\/[\w.-]+\.txt$/.test(s)) href = `${GH}${dir}transcript/${s}`;
    else if (codePaths.test(s)) href = `${GH}${dir}project/${s}`;
    else if (s === "tests/" || s === "tests") href = `${TREE}${dir}project/tests`;
    else if (s === "LEARNING_LOG.md") href = `${GH}${dir}project/LEARNING_LOG.md`;
    if (href && !c.closest("a")) {
      const a = document.createElement("a");
      a.href = href;
      c.replaceWith(a);
      a.appendChild(c);
    }
  });
  return el;
}

async function fetchText(path) {
  const r = await fetch(path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.text();
}

function applyStaticText() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant-TW";
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.querySelector(".translated").hidden = lang === sc().original;

  const picker = document.getElementById("picker");
  picker.innerHTML = "";
  SCENARIO_IDS.forEach((id) => {
    const copy = SCENARIOS[id].i18n[lang];
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.demo = id;
    b.setAttribute("aria-pressed", String(id === scenario));
    b.innerHTML = `<span class="kind">${copy["pick.kind"]}<span class="viewing">${t("pick.viewing")}</span></span>` +
      `<b>${copy["pick.title"]}</b><span class="desc">${copy["pick.desc"]}</span>`;
    b.addEventListener("click", () => selectScenario(id));
    picker.appendChild(b);
  });

  document.getElementById("stats").innerHTML = sc().stats
    .map(([value, key]) => `<div class="stat"><b>${value}</b><span>${t(key)}</span></div>`).join("");

  const loop = document.getElementById("loop");
  const rail = document.getElementById("rail");
  loop.innerHTML = "";
  rail.innerHTML = "";
  STEP_IDS.forEach((id, i) => {
    const [name, desc] = t("steps")[i];
    const cp = CHECKPOINTS.has(id);
    const li = document.createElement("li");
    if (cp) li.classList.add("checkpoint");
    li.innerHTML = `<span class="n">${i}${cp ? " · ✋" : ""}</span><b>${name}</b>${desc}`;
    loop.appendChild(li);
    const r = document.createElement("li");
    r.dataset.step = id;
    if (cp) r.classList.add("checkpoint");
    r.textContent = `${i} · ${name}${cp ? " ✋" : ""}`;
    rail.appendChild(r);
  });
}

async function buildTurns(isCurrent) {
  const { turns, original } = sc();
  const box = document.getElementById("turns");
  const links = document.getElementById("turnlinks");
  box.innerHTML = `<p class="note" data-label="${t("note.label")}">${t("loading")}</p>`;
  links.innerHTML = "";
  const texts = await Promise.all(turns.map((turn) => fetchText(turnPath(turn))));
  if (!isCurrent()) return;
  box.innerHTML = "";
  turns.forEach((turn, i) => {
    const art = document.createElement("article");
    art.className = `turn ${turn.who}`;
    art.id = `turn-${turn.n}`;
    art.dataset.steps = turn.steps.join(" ");

    const raw = lang === original
      ? `<a href="${GH}${turnPath(turn)}">${turnName(turn)}</a>`
      : `<a href="${GH}${turnPath(turn)}">${lang}/${turnName(turn)}</a> · <a href="${GH}${turnPath(turn, original)}">original</a>`;
    const head = document.createElement("div");
    head.className = "turn-head";
    head.innerHTML = `<span class="who">Turn ${turn.n} · ${t(turn.who === "user" ? "who.user" : "who.agent")}</span>` +
      turn.steps.map((id) => `<span class="chip${CHECKPOINTS.has(id) ? " checkpoint" : ""}">${stepLabel(id)}</span>`).join("") +
      `<span class="raw">${raw}</span>`;
    art.appendChild(head);

    const note = document.createElement("p");
    note.className = "note";
    note.dataset.label = t("note.label");
    note.textContent = t("notes")[i];
    art.appendChild(note);

    const bubble = renderMarkdown(texts[i]);
    bubble.classList.add("bubble");
    art.appendChild(bubble);
    box.appendChild(art);

    if (turn.who === "agent") {
      requestAnimationFrame(() => {
        if (bubble.scrollHeight > 760) {
          bubble.classList.add("folded");
          const btn = document.createElement("button");
          btn.className = "unfold";
          btn.textContent = t("unfold");
          btn.onclick = () => { bubble.classList.remove("folded"); btn.remove(); };
          bubble.after(btn);
        }
      });
    }

    const a = document.createElement("a");
    a.href = `#turn-${turn.n}`;
    a.textContent = `T${turn.n}`;
    a.dataset.turn = turn.n;
    links.appendChild(a);
  });
  watchTurns();
}

function watchTurns() {
  if (observer) observer.disconnect();
  const railItems = [...document.querySelectorAll("#rail li")];
  const links = [...document.querySelectorAll("#turnlinks a")];
  observer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const steps = e.target.dataset.steps.split(" ").filter(Boolean);
      railItems.forEach((li) => li.classList.toggle("on", steps.includes(li.dataset.step)));
      links.forEach((l) => l.classList.toggle("on", l.dataset.turn === e.target.id.split("-")[1]));
    }
  }, { rootMargin: "-35% 0px -60% 0px" });
  document.querySelectorAll(".turn").forEach((el) => observer.observe(el));
}

async function buildLearningLog(isCurrent) {
  const log = document.getElementById("learning-log");
  // Give each log field its own paragraph so a numbered list doesn't swallow "Next time:".
  const src = (await fetchText(logPath())).replace(/^(Task|Unknown types|Learned|Next time|Level):/gm, "\n**$1:**");
  if (!isCurrent()) return;
  log.innerHTML = renderMarkdown(src).innerHTML;
}

function colorTerm(text) {
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  return text.split("\n").map((line) => {
    const l = esc(line);
    if (/\b(FAILED|AssertionError|assert 2 == 1|failed)\b/.test(line)) return `<span class="bad">${l}</span>`;
    if (/\b(PASSED|passed)\b/.test(line)) return `<span class="good">${l}</span>`;
    if (/^==> charges: [2-9]/.test(line)) return `<span class="bad">${l}</span>`;
    if (/^==> charges: 1/.test(line)) return `<span class="good">${l}</span>`;
    if (/^\s+\d+ms\s+[A-Z-]\s/.test(line)) return `<span class="hl">${l}</span>`;
    return l;
  }).join("\n");
}

function evidenceCard(title, href, linkText, pre) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="card-head"><b>${title}</b><a href="${href}">${linkText}</a></div>`;
  card.appendChild(pre);
  return card;
}

// Terminal output and the diff are the same in both languages; only the card titles are translated.
async function buildEvidence(isCurrent) {
  const { dir, evidence } = sc();
  const box = document.getElementById("evidence-cards");
  box.innerHTML = "";
  const loads = [];
  for (const row of evidence) {
    const parent = row.length > 1 ? box.appendChild(Object.assign(document.createElement("div"), { className: "grid-2" })) : box;
    for (const art of row) {
      const pre = Object.assign(document.createElement("pre"), { className: "term" });
      const badge = art.badge ? `<span class="badge ${art.badge[0]}">${art.badge[1]}</span>` : "";
      parent.appendChild(evidenceCard(`<span>${t(art.key)}</span>${badge}`, `${GH}${dir}${art.path}`, t("raw"), pre));
      loads.push(fetchText(dir + art.path).then((text) => {
        if (!isCurrent()) return;
        pre.innerHTML = colorTerm(text);
        const first = pre.querySelector(".hl");
        if (first) pre.scrollTop = Math.max(0, first.offsetTop - pre.offsetTop - 40);
      }).catch((e) => { pre.textContent = String(e); }));
    }
  }
  const diff = Object.assign(document.createElement("pre"), { className: "diff" });
  box.appendChild(evidenceCard(t("evidence.diff"), `${GH}${dir}changes.diff`, "changes.diff", diff));
  loads.push(fetchText(`${dir}changes.diff`).then((text) => {
    if (!isCurrent()) return;
    for (const line of text.split("\n")) {
      const s = document.createElement("span");
      if (line.startsWith("diff ")) s.className = "f";
      else if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("@@")) s.className = "h";
      else if (line.startsWith("+")) s.className = "a";
      else if (line.startsWith("-")) s.className = "d";
      s.textContent = line || " ";
      diff.appendChild(s);
    }
  }).catch((e) => { diff.textContent = String(e); }));
  await Promise.all(loads);
}

async function render() {
  const id = ++renderId;
  const isCurrent = () => id === renderId;
  applyStaticText();
  buildEvidence(isCurrent);
  try {
    await Promise.all([buildTurns(isCurrent), buildLearningLog(isCurrent)]);
  } catch (e) {
    if (isCurrent()) document.getElementById("turns").innerHTML = `<p class="error">${t("load.error").replace("{msg}", e.message)}</p>`;
  }
}

function setParam(name, value) {
  const url = new URL(location.href);
  url.searchParams.set(name, value);
  url.hash = "";
  history.replaceState(null, "", url);
}

function selectScenario(id) {
  if (id === scenario) return;
  scenario = id;
  setParam("demo", id);
  render();
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("jit-demo-lang", lang); } catch (_) {}
  setParam("lang", lang);
  render();
}));

document.querySelectorAll("button.copy").forEach((b) => b.addEventListener("click", async () => {
  const text = document.getElementById(b.dataset.copy).textContent;
  try { await navigator.clipboard.writeText(text); b.textContent = t("copied"); }
  catch (_) { b.textContent = t("copy.fail"); }
  setTimeout(() => (b.textContent = t("copy")), 1600);
}));

// The "Read the original" link in the translation banner switches language in place.
document.addEventListener("click", (e) => {
  const a = e.target.closest('a[href="?lang=zh"]');
  if (!a) return;
  e.preventDefault();
  document.querySelector('.lang button[data-lang="zh"]').click();
  document.getElementById("session").scrollIntoView();
});

lang = pickLanguage();
scenario = pickScenario();
render();
</script>
</body>
</html>
